<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loomis Face Constructor</title>
<style>
:root{--bg:#15171c;--panel:#1d2027;--line:#2b2f39;--txt:#e6e8ee;--mut:#8b91a1;--acc:#fbbf24;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--txt)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);height:100%}
.app{display:flex;flex-direction:column;height:100%}
.top{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.top h1{font-size:15px;font-weight:600;margin:0 auto 0 0}
.main{flex:1;display:grid;grid-template-columns:170px 1fr 240px;min-height:0}
.side{background:var(--panel);padding:12px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.side.l{border-right:1px solid var(--line)}.side.r{border-left:1px solid var(--line)}
h3{font-size:12px;color:var(--mut);font-weight:500;margin:10px 0 2px}
button,select,.btn{background:#262a33;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:13px;cursor:pointer;transition:background .15s,border-color .15s;text-align:center}
button:hover,.btn:hover{background:#2f3440}button.on{border-color:var(--acc);color:var(--acc)}button:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:6px;flex-wrap:wrap}.row>*{flex:1}
label.ck{display:flex;gap:8px;align-items:center;font-size:13px;padding:3px 0}
input[type=range]{width:100%;accent-color:var(--acc)}
.stage{position:relative;overflow:hidden;touch-action:none;background:repeating-conic-gradient(#191b21 0 25%,#16181d 0 50%) 0 0/24px 24px;cursor:grab}
.plane{position:absolute;left:0;top:0;transform-origin:0 0}.plane canvas{position:absolute;left:0;top:0}
.msg{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(20,22,27,.94);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13px;white-space:pre-line;text-align:center;max-width:90%}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--mut);text-align:center;padding:20px}
.pose{font-size:13px;line-height:1.6;color:var(--mut)}.pose b{color:var(--txt)}
.hide{display:none!important}
@media(max-width:820px){
 html,body{height:auto}.app{height:auto;min-height:100%}
 .main{display:flex;flex-direction:column}.stage{order:-1;height:62vh;flex:none}
 .side.l,.side.r{border:0;border-top:1px solid var(--line)}
}
</style></head><body>
<div class="app">
 <div class="top">
  <h1>Loomis Face Constructor</h1>
  <label class="btn">Upload Photo<input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/*" hidden></label>
  <button id="detect" disabled>Auto Detect</button>
  <button id="edit" disabled>Edit</button>
  <select id="kind"><option value="orig">Original only</option><option value="loomis">Loomis only</option><option value="orig+loomis" selected>Original + Loomis</option><option value="orig+grid">Original + Grid</option><option value="all">Original + Loomis + Grid</option></select>
  <button id="png" disabled>Export PNG</button><button id="jpg" disabled>Export JPG</button><button id="exl" disabled>Export Loomis</button>
 </div>
 <div class="main">
  <div class="side l">
   <h3>View</h3><div id="modes" style="display:flex;flex-direction:column;gap:6px"></div>
   <h3>Zoom</h3>
   <div class="row"><button id="zo">−</button><button id="zi">+</button></div>
   <div class="row"><button id="fit">Fit</button><button id="rst">Reset</button></div>
   <div id="editbox" class="hide"><h3>Edit construction</h3><div class="pose">Drag the white points. The construction updates live.</div><button id="reset" style="width:100%;margin-top:8px">Reset Edits</button></div>
  </div>
  <div class="stage" id="stage">
   <div class="plane" id="plane" style="display:none"><canvas id="base"></canvas><canvas id="over"></canvas></div>
   <div class="empty" id="empty"><div><p style="font-size:18px;color:#e6e8ee;margin:0 0 6px">Upload a portrait to construct its Loomis head</p><p style="margin:0">JPG, PNG or WEBP. The photo stays in your browser.</p></div></div>
   <div class="msg hide" id="msg"></div>
  </div>
  <div class="side r">
   <h3>Construction</h3><div id="layers"></div>
   <h3>Opacity</h3><input id="opacity" type="range" min="0" max="1" step=".01" value=".92">
   <h3>Line thickness</h3><div class="row" id="thick"></div>
   <h3>Grid</h3>
   <div class="row"><button id="gridon">Off</button><select id="gridtype"><option value="0">Square</option><option value="1">3×3</option><option value="2" selected>4×4</option><option value="3">5×5</option><option value="4">8×8</option><option value="5">10×10</option></select></div>
   <input id="gridop" type="range" min=".05" max="1" step=".01" value=".35">
   <div id="poseBox" class="hide"><h3>Head pose</h3><div class="pose" id="pose"></div></div>
  </div>
 </div>
</div>
<script type="module">
import{FaceLandmarker,FilesetResolver}from"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
const WASM="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
const MODEL="https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";
const $=s=>document.querySelector(s);

// ---------- geometry ----------
const add=(a,b)=>({x:a.x+b.x,y:a.y+b.y}),sub=(a,b)=>({x:a.x-b.x,y:a.y-b.y}),mul=(a,k)=>({x:a.x*k,y:a.y*k});
const lerp=(a,b,t)=>add(a,mul(sub(b,a),t)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),dot=(a,b)=>a.x*b.x+a.y*b.y;
const clamp=(v,lo,hi)=>Math.min(hi,Math.max(lo,v));
function bz(p){const o=[p[0]];for(let i=0;i<p.length-1;i++){const p0=p[i-1]||p[i],p1=p[i],p2=p[i+1],p3=p[i+2]||p2;o.push(add(p1,mul(sub(p2,p0),1/6)),sub(p2,mul(sub(p3,p1),1/6)),p2);}return o;}
function fitEllipse(pts,c,rot){const cs=Math.cos(rot),sn=Math.sin(rot);let a=0,b=0;for(const p of pts){const dx=p.x-c.x,dy=p.y-c.y,u=dx*cs+dy*sn,v=-dx*sn+dy*cs;a+=u*u;b+=v*v;}const n=Math.max(1,pts.length);return{cx:c.x,cy:c.y,rx:Math.sqrt(2*a/n),ry:Math.sqrt(2*b/n),rot};}

// yaw>0: head turned toward image-left; pitch>0: looking down
function headPose(lm,W,H){
 const X=i=>lm[i].x*W,Y=i=>lm[i].y*H,Z=i=>lm[i].z*W,deg=r=>r*180/Math.PI;
 const yaw=deg(Math.atan2(Z(454)-Z(234),X(454)-X(234)));
 const pitch=deg(Math.atan2(Z(152)-Z(10),Y(152)-Y(10)))+8;
 const roll=deg(Math.atan2(Y(263)-Y(33),X(263)-X(33)));
 let pose="Front";
 if(Math.abs(yaw)>55)pose=yaw>0?"Profile Left":"Profile Right";
 else if(Math.abs(yaw)>18)pose=yaw>0?"3/4 Left":"3/4 Right";
 else if(pitch>16)pose="Looking Down";else if(pitch<-16)pose="Looking Up";
 return{yaw,pitch,roll,pose};
}
const OVAL=[10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109];
const JAW=[234,132,58,172,150,176,152,400,379,397,288,361,454];
const HANDLES={skullCenter:"Skull center",skullTop:"Skull top",skullLeft:"Skull left",skullRight:"Skull right",centerTop:"Centerline top",centerBottom:"Centerline bottom",browLeft:"Brow left",browRight:"Brow right",jawLeft:"Jaw left",jawRight:"Jaw right",chin:"Chin",noseTip:"Nose tip"};

function constructLoomisHead(lm,W,H,pose,ov){
 const P=lm.map(l=>({x:l.x*W,y:l.y*H}));
 for(const[i,k]of[[105,"browLeft"],[334,"browRight"],[172,"jawLeft"],[397,"jawRight"],[152,"chin"],[1,"noseTip"]])if(ov[k])P[i]=ov[k];
 const rot=pose.roll*Math.PI/180,yaw=pose.yaw*Math.PI/180;
 const r={x:Math.cos(rot),y:Math.sin(rot)},u={x:Math.sin(rot),y:-Math.cos(rot)};
 const faceH=dist(P[10],P[152]),mid=(a,b)=>lerp(P[a],P[b],.5);
 // cranial mass
 const c=ov.skullCenter||lerp(mid(127,356),mid(105,334),.5);
 const R0=.52*Math.hypot(dist(P[234],P[454]),(lm[454].z-lm[234].z)*W);
 const pts=[add(P[10],mul(u,.28*faceH)),P[234],P[454],...OVAL.map(i=>P[i]).filter(p=>dot(sub(p,c),u)>0)];
 const fit=fitEllipse(pts,c,rot);
 let rx=clamp(fit.rx,.92*R0,1.1*R0),ry=clamp(fit.ry,.95*R0,1.25*R0);
 const so=ov.skullRight||ov.skullLeft;if(so)rx=dist(c,so);if(ov.skullTop)ry=dist(c,ov.skullTop);
 const cranialSphere={cx:c.x,cy:c.y,rx,ry,rot},top=add(c,mul(u,ry));
 // side planes
 const sinY=Math.sin(yaw),cosY=Math.cos(yaw),d=.67,k=Math.sqrt(1-d*d);
 const sidePlane=[-1,1].map(s=>{const t=add(c,mul(r,s*d*rx*Math.abs(cosY)));return{e:{cx:t.x,cy:t.y,rx:Math.max(.07*rx,k*rx*Math.abs(sinY)),ry:k*ry,rot},visible:s*sinY<=.05};});
 // centerline, brow, eye
 const cTop=ov.centerTop||top,cBot=ov.centerBottom||sub(P[152],mul(u,.05*faceH));
 const centerLine=bz([cTop,P[10],P[168],P[1],P[164],cBot]);
 const browLine=bz([P[127],P[105],P[9],P[334],P[356]]);
 const eyeLine=bz([P[127],P[33],mid(133,362),P[263],P[356]]);
 const jawLine={curve:bz(JAW.map(i=>P[i])),rami:[[P[234],P[172]],[P[454],P[397]]]};
 const aw=dist(P[129],P[358]);
 const noseConstruction={axis:[P[168],P[1]],wedge:[[P[168],P[129]],[P[168],P[358]]],tip:{c:P[1],r:.3*aw},base:bz([P[129],P[98],P[2],P[327],P[358]])};
 const ext=mul(sub(P[291],P[61]),.12);
 const mouthConstruction={line:bz([P[61],mid(13,14),P[291]]),width:[sub(P[61],ext),add(P[291],ext)],upper:bz([P[61],P[0],P[291]]),lower:bz([P[61],P[17],P[291]]),center:[P[0],P[17]]};
 const chinConstruction={cap:bz([P[176],P[152],P[400]]),fold:bz([lerp(P[61],P[176],.6),P[200],lerp(P[291],P[400],.6)])};
 const nA=lerp(P[172],P[234],.55),nB=lerp(P[397],P[454],.55),drop=mul(u,-.85*faceH),inw=mul(sub(nB,nA),.06);
 const neckConstruction=[[nA,add(add(nA,drop),inw)],[nB,sub(add(nB,drop),inw)]];
 const handles={skullCenter:c,skullTop:ov.skullTop||top,skullLeft:ov.skullLeft||sub(c,mul(r,rx)),skullRight:ov.skullRight||add(c,mul(r,rx)),centerTop:cTop,centerBottom:cBot,browLeft:P[105],browRight:P[334],jawLeft:P[172],jawRight:P[397],chin:P[152],noseTip:P[1]};
 return{cranialSphere,sidePlane,centerLine,browLine,eyeLine,jawLine,noseConstruction,mouthConstruction,chinConstruction,neckConstruction,handles};
}

// ---------- rendering ----------
const LAYERS=[["sphere","Cranial sphere"],["centerline","Centerline"],["brow","Brow line"],["eye","Eye line"],["side","Side plane"],["jaw","Jaw"],["nose","Nose"],["mouth","Mouth"],["chin","Chin"],["neck","Neck"],["landmarks","Facial landmarks"]];
const L=Object.fromEntries(LAYERS.map(([k])=>[k,k!=="landmarks"]));
function drawLoomis(x,c,w,alpha){
 x.save();x.lineCap="round";x.lineJoin="round";
 const st=(col,k=1,dash=[],a=1)=>{x.strokeStyle=col;x.lineWidth=w*k;x.setLineDash(dash.map(v=>v*w));x.globalAlpha=alpha*a;};
 const s=()=>{const col=x.strokeStyle,lw=x.lineWidth,d=x.getLineDash();x.setLineDash([]);x.strokeStyle="rgba(0,0,0,.45)";x.lineWidth=lw*2.4;x.stroke();x.setLineDash(d);x.strokeStyle=col;x.lineWidth=lw;x.stroke();};
 const bez=p=>{x.beginPath();x.moveTo(p[0].x,p[0].y);for(let i=1;i+2<p.length;i+=3)x.bezierCurveTo(p[i].x,p[i].y,p[i+1].x,p[i+1].y,p[i+2].x,p[i+2].y);s();};
 const seg=(a,b)=>{x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);s();};
 const ell=e=>{x.beginPath();x.ellipse(e.cx,e.cy,e.rx,e.ry,e.rot,0,Math.PI*2);s();};
 if(L.sphere){st("#38bdf8");ell(c.cranialSphere);}
 if(L.side)for(const p of c.sidePlane){st("#38bdf8",.9,p.visible?[]:[6,5],p.visible?1:.55);ell(p.e);}
 if(L.brow){st("#f472b6",1.1);bez(c.browLine);}
 if(L.eye){st("#f472b6",.9,[7,5]);bez(c.eyeLine);}
 if(L.jaw){st("#a3e635",1.2);bez(c.jawLine.curve);st("#a3e635",.8,[5,5]);c.jawLine.rami.forEach(r=>seg(r[0],r[1]));}
 if(L.centerline){st("#fbbf24",1.7);bez(c.centerLine);}
 if(L.nose){const n=c.noseConstruction;st("#fb923c",1.1);seg(n.axis[0],n.axis[1]);n.wedge.forEach(q=>seg(q[0],q[1]));bez(n.base);x.beginPath();x.arc(n.tip.c.x,n.tip.c.y,n.tip.r,0,7);s();}
 if(L.mouth){const m=c.mouthConstruction;st("#f87171",1.2);bez(m.line);st("#f87171",.8,[4,4]);bez(m.upper);bez(m.lower);seg(m.width[0],m.width[1]);seg(m.center[0],m.center[1]);}
 if(L.chin){st("#a3e635",1.1);bez(c.chinConstruction.cap);st("#a3e635",.8,[4,4]);bez(c.chinConstruction.fold);}
 if(L.neck){st("#c4b5fd",1.1);c.neckConstruction.forEach(q=>seg(q[0],q[1]));}
 x.restore();
}
function drawHandles(x,h,z){
 const r=9/z;x.save();x.font=`${12/z}px system-ui,sans-serif`;
 for(const k in h){const p=h[k];x.beginPath();x.arc(p.x,p.y,r,0,7);x.fillStyle="#fff";x.strokeStyle="#0ea5e9";x.lineWidth=2/z;x.fill();x.stroke();
  x.lineWidth=3/z;x.strokeStyle="rgba(0,0,0,.7)";x.strokeText(HANDLES[k],p.x+r+3/z,p.y+4/z);x.fillStyle="#fff";x.fillText(HANDLES[k],p.x+r+3/z,p.y+4/z);}
 x.restore();
}
function drawGrid(x,W,H,type,op,w){
 const n=[0,3,4,5,8,10][type],sx=n?W/n:Math.max(W,H)/8,sy=n?H/n:sx;
 x.save();x.globalAlpha=op;x.strokeStyle="#e5e7eb";x.lineWidth=w;x.beginPath();
 for(let v=0;v<=W+1;v+=sx){x.moveTo(v,0);x.lineTo(v,H);}for(let v=0;v<=H+1;v+=sy){x.moveTo(0,v);x.lineTo(W,v);}
 x.stroke();x.restore();
}
function drawLandmarks(x,lm,W,H,w){x.save();x.fillStyle="rgba(255,255,255,.5)";for(const p of lm){x.beginPath();x.arc(p.x*W,p.y*H,w*.6,0,7);x.fill();}x.restore();}

// ---------- app state ----------
const S={img:null,faces:[],sel:0,busy:false,err:"",mode:"both",opacity:.92,thick:1.2,gridOn:false,gridType:2,gridOp:.35,edit:false,ov:{},view:{zoom:1,x:0,y:0},pose:null,con:null};
const stage=$("#stage"),plane=$("#plane"),base=$("#base"),over=$("#over");
const MODES=[["original","Original"],["loomis","Loomis"],["landmarks","Landmarks"],["grid","Grid"],["both","Original + Loomis"]];

function recompute(){
 const f=S.faces[S.sel];
 if(S.img&&f){S.pose=headPose(f,S.img.width,S.img.height);S.con=constructLoomisHead(f,S.img.width,S.img.height,S.pose,S.ov);}
 else{S.pose=null;S.con=null;}
}
const showL=()=>S.mode==="loomis"||S.mode==="both"||S.edit,showG=()=>S.gridOn||S.mode==="grid",showLm=()=>S.mode==="landmarks"||(showL()&&L.landmarks);
function paint(x,w){
 const{width:W,height:H}=S.img,lw=Math.max(W,H)/700*S.thick,f=S.faces[S.sel];
 if(w.grid)drawGrid(x,W,H,S.gridType,S.gridOp,lw*.6);
 if(w.lm&&f)drawLandmarks(x,f,W,H,lw);
 if(w.loomis&&S.con)drawLoomis(x,S.con,lw,S.opacity);
}
let raf=0;
function render(){ // rendering only; detection is never re-run here
 cancelAnimationFrame(raf);
 raf=requestAnimationFrame(()=>{
  if(!S.img)return;
  const x=over.getContext("2d");x.clearRect(0,0,over.width,over.height);
  paint(x,{loomis:showL(),grid:showG(),lm:showLm()});
  if(S.edit&&S.con)drawHandles(x,S.con.handles,S.view.zoom);
 });
}
function applyView(){const v=S.view;plane.style.transform=`translate(${v.x}px,${v.y}px) scale(${v.zoom})`;render();}
function fit(){if(!S.img)return;const z=Math.min(stage.clientWidth/S.img.width,stage.clientHeight/S.img.height)*.94;S.view={zoom:z,x:(stage.clientWidth-S.img.width*z)/2,y:(stage.clientHeight-S.img.height*z)/2};applyView();}
function zoomAt(f,mx,my){const v=S.view,z=clamp(v.zoom*f,.03,30);S.view={zoom:z,x:mx-(mx-v.x)*z/v.zoom,y:my-(my-v.y)*z/v.zoom};applyView();}

function ui(){
 const has=!!S.img,hasC=!!S.con;
 $("#detect").disabled=!has||S.busy;$("#edit").disabled=!hasC;$("#edit").classList.toggle("on",S.edit);
 ["png","jpg"].forEach(i=>$("#"+i).disabled=!has);$("#exl").disabled=!hasC;
 $("#editbox").classList.toggle("hide",!S.edit);
 $("#gridon").textContent=S.gridOn?"On":"Off";$("#gridon").classList.toggle("on",S.gridOn);
 document.querySelectorAll("#modes button").forEach(b=>b.classList.toggle("on",b.dataset.m===S.mode));
 document.querySelectorAll("#thick button").forEach(b=>b.classList.toggle("on",+b.dataset.v===S.thick));
 $("#poseBox").classList.toggle("hide",!S.pose);
 if(S.pose)$("#pose").innerHTML=`<b>${S.pose.pose}</b><br>yaw ${S.pose.yaw.toFixed(0)}° · pitch ${S.pose.pitch.toFixed(0)}° · roll ${S.pose.roll.toFixed(0)}°`;
 // status message
 const m=$("#msg");let t="";
 if(S.busy)t="Analyzing face...";else if(S.err)t=S.err;else if(has){
  const f=S.faces[S.sel];let low=false;
  if(f&&S.pose){const xs=f.map(p=>p.x),ys=f.map(p=>p.y);low=(Math.max(...xs)-Math.min(...xs))*(Math.max(...ys)-Math.min(...ys))<.02||Math.abs(S.pose.yaw)>80;}
  t=!S.faces.length?"No face detected.\nPlease upload a clear front or 3/4 face photograph.":S.faces.length>1?"Multiple faces detected.\nSelect the face you want to analyze.":low?"Low confidence detection.\nYou can manually adjust the construction.":"Loomis construction complete";
 }
 m.classList.toggle("hide",!t);m.textContent=t;
 if(S.faces.length>1&&!S.busy){const row=document.createElement("div");row.className="row";row.style.marginTop="8px";
  S.faces.forEach((_,i)=>{const b=document.createElement("button");b.textContent="Face "+(i+1);if(i===S.sel)b.className="on";b.onclick=e=>{e.stopPropagation();S.sel=i;S.ov={};recompute();ui();render();};row.append(b);});m.append(row);}
}

// ---------- build controls ----------
$("#modes").innerHTML=MODES.map(([m,l])=>`<button data-m="${m}">${l}</button>`).join("");
$("#modes").onclick=e=>{const m=e.target.dataset.m;if(m){S.mode=m;ui();render();}};
$("#layers").innerHTML=LAYERS.map(([k,l])=>`<label class="ck"><input type="checkbox" data-k="${k}" ${L[k]?"checked":""}>${l}</label>`).join("");
$("#layers").onchange=e=>{L[e.target.dataset.k]=e.target.checked;render();};
$("#thick").innerHTML=[["Thin",.7],["Medium",1.2],["Thick",2]].map(([l,v])=>`<button data-v="${v}">${l}</button>`).join("");
$("#thick").onclick=e=>{if(e.target.dataset.v){S.thick=+e.target.dataset.v;ui();render();}};
$("#opacity").oninput=e=>{S.opacity=+e.target.value;render();};
$("#gridon").onclick=()=>{S.gridOn=!S.gridOn;ui();render();};
$("#gridtype").onchange=e=>{S.gridType=+e.target.value;render();};
$("#gridop").oninput=e=>{S.gridOp=+e.target.value;render();};
$("#edit").onclick=()=>{S.edit=!S.edit;ui();render();};
$("#reset").onclick=()=>{S.ov={};recompute();render();};
$("#zi").onclick=()=>zoomAt(1.25,stage.clientWidth/2,stage.clientHeight/2);
$("#zo").onclick=()=>zoomAt(1/1.25,stage.clientWidth/2,stage.clientHeight/2);
$("#fit").onclick=fit;
$("#rst").onclick=()=>{if(!S.img)return;S.view={zoom:1,x:(stage.clientWidth-S.img.width)/2,y:(stage.clientHeight-S.img.height)/2};applyView();};
stage.ondblclick=fit;
stage.onwheel=e=>{e.preventDefault();const r=stage.getBoundingClientRect();zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top);};

// ---------- pointer: pan, pinch, handle drag ----------
const ptrs=new Map();let drag=null,pinch=0;
const pd=()=>{const[a,b]=[...ptrs.values()];return Math.hypot(a.x-b.x,a.y-b.y);};
const toImg=e=>{const r=over.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*S.img.width,y:(e.clientY-r.top)/r.height*S.img.height};};
stage.onpointerdown=e=>{
 if(!S.img||e.target.closest(".msg"))return;
 stage.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptrs.size===2){drag=null;pinch=pd();return;}
 if(S.edit&&S.con){const p=toImg(e);let best=null,bd=22/S.view.zoom;for(const k in S.con.handles){const d=dist(p,S.con.handles[k]);if(d<bd){bd=d;best=k;}}if(best){drag={name:best};return;}}
 drag={sx:e.clientX,sy:e.clientY,vx:S.view.x,vy:S.view.y};
};
stage.onpointermove=e=>{
 if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptrs.size===2){const d=pd(),[a,b]=[...ptrs.values()],r=stage.getBoundingClientRect();zoomAt(d/pinch,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top);pinch=d;return;}
 if(!drag)return;
 if(drag.name){S.ov[drag.name]=toImg(e);recompute();render();}
 else{S.view.x=drag.vx+e.clientX-drag.sx;S.view.y=drag.vy+e.clientY-drag.sy;applyView();}
};
stage.onpointerup=stage.onpointercancel=e=>{ptrs.delete(e.pointerId);drag=null;};

// ---------- image + detection ----------
let lmP=null;
function getLandmarker(){
 return lmP||(lmP=(async()=>{
  const fs=await FilesetResolver.forVisionTasks(WASM);
  const mk=d=>FaceLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:MODEL,delegate:d},runningMode:"IMAGE",numFaces:5});
  try{return await mk("GPU");}catch{return await mk("CPU");}
 })().catch(e=>{lmP=null;throw e;}));
}
async function analyze(){
 S.busy=true;S.err="";S.ov={};S.faces=[];S.sel=0;recompute();ui();render();
 try{const lm=await getLandmarker();S.faces=lm.detect(S.img).faceLandmarks;}
 catch(e){S.err="The face model could not load. Check your internet connection, then press Auto Detect.";}
 S.busy=false;recompute();ui();render();
}
$("#detect").onclick=analyze;
$("#file").onchange=async e=>{
 const f=e.target.files[0];e.target.value="";if(!f)return;
 try{
  const bmp=await createImageBitmap(f),s=Math.min(1,4096/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas");c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  S.img=c;[base,over].forEach(k=>{k.width=c.width;k.height=c.height;});
  base.getContext("2d").drawImage(c,0,0);
  plane.style.width=c.width+"px";plane.style.height=c.height+"px";plane.style.display="block";$("#empty").classList.add("hide");
  base.style.opacity=S.mode==="loomis"?.12:1;fit();analyze();
 }catch{S.err="Could not read that image. Use a JPG, PNG or WEBP file.";ui();}
};
const oldUi=ui;
// dim the photo in "Loomis" mode
$("#modes").addEventListener("click",()=>{base.style.opacity=S.mode==="loomis"?.12:1;});

// ---------- export ----------
function exportImage(kind,fmt){
 if(!S.img)return;
 const c=document.createElement("canvas");c.width=S.img.width;c.height=S.img.height;const x=c.getContext("2d");
 if(kind==="loomis"&&fmt==="jpeg"){x.fillStyle="#111";x.fillRect(0,0,c.width,c.height);}
 if(kind!=="loomis")x.drawImage(S.img,0,0);
 const lo=kind.includes("loomis")||kind==="all",gr=kind.includes("grid")||kind==="all";
 paint(x,{loomis:lo,grid:gr,lm:lo&&L.landmarks});
 c.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`loomis-${kind.replace("+","-")}.${fmt==="jpeg"?"jpg":"png"}`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);},"image/"+fmt,.95);
}
$("#png").onclick=()=>exportImage($("#kind").value,"png");
$("#jpg").onclick=()=>exportImage($("#kind").value,"jpeg");
$("#exl").onclick=()=>exportImage("loomis","png");
addEventListener("resize",()=>S.img&&fit());
ui();
</script></body></html>
